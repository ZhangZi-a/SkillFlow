[project]
name = "skillflow"
version = "0.1.0"
description = "Official SkillFlow benchmark release"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "harbor @ git+https://github.com/laude-institute/harbor.git",
    "litellm>=1.70.0",
    "matplotlib>=3.9.0",
    "numpy>=2.0.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.8.0",
    "pyyaml>=6.0.0",
    "tenacity>=9.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 144

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "RUF",
]
ignore = [
    "E501",
    "E722",
    "B008",
    "B905",
    "UP038",
]

[tool.ruff.lint.isort]
known-first-party = ["skillflow"]
force-single-line = false
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "ruff>=0.8.0",
]
